{#- Inline-edit form row. Saving POSTs /usage/{id} and swaps the display row back. -#}
<tr id="usage-row-{{ row.id }}" class="usage-row usage-row-editing">
  <td colspan="6">
    <form hx-post="/usage/{{ row.id }}"
          hx-target="#usage-row-{{ row.id }}" hx-swap="outerHTML">
      <input type="date" name="date" value="{{ row.date.isoformat() }}" required>
      <input type="number" name="hours" step="0.25" value="{{ "%g"|format(row.hours) }}" required>
      <select name="type">
        <option value="pto" {% if row.type.value == "pto" %}selected{% endif %}>PTO</option>
        <option value="personal_holiday" {% if row.type.value == "personal_holiday" %}selected{% endif %}>Personal Holiday</option>
      </select>
      <input type="text" name="reason" value="{{ row.reason or "" }}" placeholder="reason">
      <button type="submit">Save</button>
      <button type="button"
              hx-get="/usage/{{ row.id }}/edit"
              hx-target="#usage-row-{{ row.id }}" hx-swap="none">Cancel</button>
    </form>
  </td>
</tr>
