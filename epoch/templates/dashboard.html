{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<hgroup>
  <h1>Dashboard</h1>
  <p>PTO accrual and usage as of {{ today.isoformat() }}.</p>
</hgroup>

{% include "_stat_cards.html" %}

<article>
  <header>
    <div class="chart-controls" id="chart-controls">
      <button type="button" data-range="ytd">YTD</button>
      <button type="button" data-range="1yr">1 yr</button>
      <button type="button" data-range="all" class="active">All</button>
      <span class="custom-range">
        <input type="date" id="range-start" aria-label="Start date">
        <input type="date" id="range-end" aria-label="End date">
        <button type="button" data-range="custom" class="secondary outline">Apply</button>
      </span>
    </div>
  </header>
  <div class="chart-wrap">
    <canvas id="pto-chart"></canvas>
  </div>
</article>
{% endblock %}
{% block scripts %}
<script src="/static/chart.umd.min.js"></script>
<script src="/static/dashboard.js"></script>
{% endblock %}
