[project]
name = "epoch"
version = "0.1.0"
description = "Self-hosted PTO tracker"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.118",
    "uvicorn>=0.34",
    "sqlmodel>=0.0.24",
    "pydantic-settings>=2.7",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
